name: Deploy ADF to ADF2

on:
  push:
    branches:
      - adf_publish   # Deploy only when ARM templates are updated

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy ARM template to ADF2
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.ADF_RESOURCE_GROUP }}
          template: ./ARMTemplateForFactory.json
          parameters: ./ARMTemplateParametersForFactory.json
          deploymentName: adf-cicd-deploy
          parametersOverrides: >
            factoryName=${{ secrets.ADF2_NAME }}
