name: Deploy ADF CI/CD

on:
  push:
    branches:
      - main

env:
  ADF_NAME: mydatasfactorys2025
  ADF_RESOURCE_GROUP: my-adf-rg
  LOCATION: eastus

jobs:
  deploy-adf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Login to Azure
      # -------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------
      # Stop running triggers
      # -------------------------
      - name: Stop running triggers in PROD
        run: |
          names=$(az datafactory trigger list \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group "$ADF_RESOURCE_GROUP" \
            --factory-name "$ADF_NAME" \
            --query "[?properties.runtimeState=='Started'].name" -o tsv)
          for n in $names; do
            echo "Stopping trigger: $n"
            az datafactory trigger stop \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
              --resource-group "$ADF_RESOURCE_GROUP" \
              --factory-name "$ADF_NAME" \
              --name "$n"
          done
        shell: bash

      # -------------------------
      # Deploy ARM template
      # -------------------------
      - name: Deploy ADF ARM template
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.ADF_RESOURCE_GROUP }}
          template: ./ARMTemplateForFactory.json
          parameters: ./ARMTemplateParametersForFactory.json
          deploymentMode: Incremental
          deploymentName: adf-deployment

      # -------------------------
      # Restart stopped triggers
      # -------------------------
      - name: Start stopped triggers in PROD
        run: |
          names=$(az datafactory trigger list \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group "$ADF_RESOURCE_GROUP" \
            --factory-name "$ADF_NAME" \
            --query "[?properties.runtimeState=='Stopped'].name" -o tsv)
          for n in $names; do
            echo "Starting trigger: $n"
            az datafactory trigger start \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
              --resource-group "$ADF_RESOURCE_GROUP" \
              --factory-name "$ADF_NAME" \
              --name "$n"
          done
        shell: bash
