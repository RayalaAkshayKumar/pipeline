name: Deploy ADF1 to ADF2

on:
  push:
    branches:
      - adf_publish   # only run when ADF publishes templates

permissions:
  id-token: write
  contents: read

jobs:
  deploy-adf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Deploy ARM template to ADF2
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.ADF_RESOURCE_GROUP }}
          template: adf_publish/mydatafactorys2025/ARMTemplateForFactory.json
          parameters: |
            adf_publish/mydatafactorys2025/ARMTemplateParametersForFactory.json
            adf_publish/mydatafactorys2025/adf.parameters.json
            factoryName=${{ secrets.ADF2_NAME }}
          deploymentName: adf2-deploy-${{ github.run_number }}
