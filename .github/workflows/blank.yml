name: Deploy ADF to Prod

on:
  push:
    branches:
      - adf_publish   # Runs when ADF Studio publishes

permissions:
  id-token: write
  contents: read

jobs:
  deploy-adf:
    runs-on: ubuntu-latest
    env:
      ADF_NAME: ${{ secrets.ADF_NAME }}                 # e.g., mydatasfactorys2025
      ADF_RESOURCE_GROUP: ${{ secrets.ADF_RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # Optional: ensure ADF CLI (used by trigger stop/start)
      - name: Ensure Data Factory CLI extension
        run: |
          az extension add --name datafactory --only-show-errors || az extension update --name datafactory

      # Stop running triggers before deployment
      - name: Stop running triggers in PROD
        run: |
          names=$(az datafactory trigger list \
            --resource-group "$ADF_RESOURCE_GROUP" \
            --factory-name "$ADF_NAME" \
            --query "[?properties.runtimeState=='Started'].name" -o tsv)
          for n in $names; do
            echo "Stopping trigger: $n"
            az datafactory trigger stop --resource-group "$ADF_RESOURCE_GROUP" --factory-name "$ADF_NAME" --name "$n"
          done
        shell: bash

      # Deploy ARM template generated by ADF Studio
      - name: Deploy ARM Template
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.ADF_RESOURCE_GROUP }}
          template: mydatasfactorys2025/ARMTemplateForFactory.json
          deploymentName: adf-deploy-${{ github.run_number }}
          parameters: |
            # From your parameters JSON (non-secrets can be inlined)
            factoryName=${{ secrets.ADF_NAME }}

            # --- SQL Linked Service 25 ---
            Ls_sql25_password=${{ secrets.LS_SQL25_PASSWORD }}
            Ls_sql25_properties_typeProperties_server=mysqlsserver2025.database.windows.net
            Ls_sql25_properties_typeProperties_database=sqldatabase25
            Ls_sql25_properties_typeProperties_userName=admin2025

            # --- Data Lake Linked Service 25 ---
            ls_datalake25_accountKey=${{ secrets.LS_DATALAKE25_KEY }}
            ls_datalake25_properties_typeProperties_url=https://mydatalaess25.dfs.core.windows.net/

            # --- MySQL Linked Service ---
            ls_mysqldatabase_password=${{ secrets.LS_MYSQL_PASSWORD }}
            ls_mysqldatabase_properties_typeProperties_server=mysqlsserver2025.database.windows.net
            ls_mysqldatabase_properties_typeProperties_database=mydatabasepractice2025
            ls_mysqldatabase_properties_typeProperties_userName=admin2025

            # --- SQL Database 25 Linked Service ---
            ls_sqldatabase25_password=${{ secrets.LS_SQLDB25_PASSWORD }}
            ls_sqldatabase25_properties_typeProperties_server=mysqlsserver2025.database.windows.net
            ls_sqldatabase25_properties_typeProperties_database=sqldatabase25
            ls_sqldatabase25_properties_typeProperties_userName=admin2025

      # Start triggers after deployment
      - name: Start stopped triggers in PROD
        run: |
          names=$(az datafactory trigger list \
            --resource-group "$ADF_RESOURCE_GROUP" \
            --factory-name "$ADF_NAME" \
            --query "[?properties.runtimeState=='Stopped'].name" -o tsv)
          for n in $names; do
            echo "Starting trigger: $n"
            az datafactory trigger start --resource-group "$ADF_RESOURCE_GROUP" --factory-name "$ADF_NAME" --name "$n"
          done
        shell: bash
